{% extends "base.html" %}
{% block title %}로그인 · {{ APP_TITLE }}{% endblock %}
{% block main_class %}auth-wrap{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-brand">PICC 계측</div>
  <p class="auth-study">{{ STUDY_TITLE }}</p>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <div class="field">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" autocomplete="username"
             autofocus required />
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required />
    </div>
    <button class="primary" type="submit" style="width:100%">로그인</button>
  </form>

  <p class="small muted" style="margin-top:1.2rem; text-align:center;">
    계정은 연구책임자가 발급합니다.
  </p>
</div>
{% endblock %}
